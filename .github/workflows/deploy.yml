name: Deploy to Strato Webhost
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    # Pinned image and pinned action commits: a deploy years from now runs the same steps as today.
    # "ubuntu-latest" and "@v4" move on their own; bump these deliberately (the comments carry the version).
    runs-on: ubuntu-24.04
    environment: STRATO
    env:
      # Path under which the app is hosted, e.g. "/fitbod-to-hevy/". Set as a repository or
      # environment variable named BASE_HREF; defaults to the web root.
      BASE_HREF: ${{ vars.BASE_HREF || '/' }}
      # Angular's application builder writes the deployable site to the browser/ subfolder.
      OUTPUT_DIR: dist/fitbod-to-hevy-converter/browser
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx ng test --watch=false

      - name: Build Angular application
        run: npx ng build --configuration production --base-href "$BASE_HREF"

      - name: Add .htaccess for routing
        run: |
          cat > "$OUTPUT_DIR/.htaccess" << EOL
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase ${BASE_HREF}

            # Serve index.html for any path that is not an existing file or directory (Angular routing)
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^(.*)$ index.html [L]
          </IfModule>

          <IfModule mod_expires.c>
            ExpiresActive On
            # Hashed bundles can be cached for a year; index.html must not be cached
            ExpiresByType text/css "access plus 1 year"
            ExpiresByType application/javascript "access plus 1 year"
            ExpiresByType image/x-icon "access plus 1 year"
            ExpiresByType text/html "access plus 0 seconds"
          </IfModule>

          <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/html text/css application/javascript
          </IfModule>
          EOL

      # lftp comes from the pinned Ubuntu image's own package archive, so its version only changes
      # when the image above is bumped.
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # This Strato package only offers SFTP + SSH (plain FTP and FTPS reset the connection),
      # so upload with lftp over SFTP using password authentication.
      - name: Deploy to Strato via SFTP
        env:
          SFTP_SERVER: ${{ secrets.STRATO_SFTP_SERVER }}
          SFTP_USER: ${{ secrets.STRATO_FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.STRATO_FTP_PASSWORD }}
          # Relative to the SFTP login directory, no spaces, no quotes: lftp took an escaped quote
          # here literally once and uploaded everything into a folder named `"STRATO-apps`.
          REMOTE_PATH: ${{ secrets.STRATO_SERVER_PATH }}
        run: |
          # --env-password reads LFTP_PASSWORD, so any character in the password is safe
          lftp --env-password -u "$SFTP_USER" "sftp://$SFTP_SERVER:22" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:timeout 30;
            mirror --reverse --verbose --parallel=4 ./$OUTPUT_DIR/ $REMOTE_PATH;
            bye"

      # A deploy that lands in the wrong folder still reports success above. This step fails the run
      # unless the public page really references the bundle that was just built.
      - name: Verify the live site serves this build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::Repository variable SITE_URL is not set (e.g. https://sintaxcode.nl/fitbod-to-hevy-converter/)."
            exit 1
          fi
          bundle=$(basename "$OUTPUT_DIR"/main-*.js)
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$SITE_URL" | grep -q "$bundle"; then
              echo "$SITE_URL serves $bundle"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$SITE_URL does not serve $bundle. Check the STRATO_SERVER_PATH secret."
          exit 1
